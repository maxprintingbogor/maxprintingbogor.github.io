<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Polaroid Print Studio Pro v2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-main: #f1f5f9;
    --bg-card: rgba(255, 255, 255, 0.85);
    --bg-card-solid: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --border-color: #e2e8f0;
    --accent-color: #4f46e5;
    --accent-hover: #4338ca;
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    --danger-color: #ef4444;
    --success-color: #10b981;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
  }

  body.dark-mode {
    --bg-main: #0b0f19;
    --bg-card: rgba(30, 41, 59, 0.7);
    --bg-card-solid: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
    --accent-color: #6366f1;
    --accent-hover: #818cf8;
    --accent-gradient: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background-color 0.3s, color 0.3s;
  }

  /* Header Navigation */
  header {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 38px; height: 38px;
    background: var(--accent-gradient);
    color: white; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
  }
  .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .brand span { font-size: 11px; background: rgba(79, 70, 229, 0.1); color: var(--accent-color); padding: 3px 8px; border-radius: 20px; font-weight: 700; }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* Layout App */
  .app-layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 24px;
    padding: 24px;
    flex: 1;
    max-width: 1800px;
    margin: 0 auto;
    width: 100%;
  }

  /* Sidebar Controls */
  .sidebar {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-shadow: var(--shadow-soft);
    height: fit-content;
  }

  .sidebar-section {
    display: flex; flex-direction: column; gap: 12px;
  }

  .section-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.8px;
    display: flex; align-items: center; gap: 6px;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 13px; font-weight: 600; color: var(--text-primary); }

  select, textarea, input[type="text"], input[type="color"] {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background: var(--bg-card-solid);
    color: var(--text-primary);
    font-size: 13px; font-weight: 500;
    outline: none; transition: all 0.2s ease;
  }

  select:focus, textarea:focus, input:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Buttons */
  .btn {
    padding: 11px 16px;
    border-radius: var(--radius-md);
    border: none; font-weight: 600; font-size: 13px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; overflow: hidden;
  }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--accent-gradient);
    color: white; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
  }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35); }

  .btn-secondary {
    background: var(--bg-card-solid); border: 1px solid var(--border-color); color: var(--text-primary);
  }
  .btn-secondary:hover { background: var(--border-color); }

  .btn-danger {
    background: rgba(239, 68, 68, 0.1); color: var(--danger-color); border: 1px solid rgba(239, 68, 68, 0.2);
  }
  .btn-danger:hover { background: var(--danger-color); color: white; }

  .shortcut-badge {
    font-size: 10px; opacity: 0.7; background: rgba(255,255,255,0.2); padding: 2px 5px; border-radius: 4px; font-family: monospace;
  }

  /* Workspace */
  .workspace { display: flex; flex-direction: column; gap: 20px; }

  /* Stats Bar Operator */
  .status-banner {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    padding: 20px 24px; border-radius: var(--radius-lg);
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: var(--shadow-soft);
  }

  .stat-card { display: flex; align-items: center; gap: 16px; }
  .stat-icon {
    width: 48px; height: 48px; border-radius: var(--radius-md);
    background: rgba(79, 70, 229, 0.1); color: var(--accent-color);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .stat-info .label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .stat-info .value { font-size: 18px; font-weight: 800; color: var(--text-primary); margin-top: 2px; }

  /* Progress Bar */
  #progressContainer {
    display: none; background: var(--bg-card-solid); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: 14px;
  }
  .progress-bg { background: var(--border-color); height: 8px; border-radius: 4px; overflow: hidden; }
  #progressBar { width: 0%; height: 100%; background: var(--accent-gradient); transition: width 0.3s; }
  #progressText { font-size: 12px; font-weight: 700; text-align: center; margin-top: 8px; color: var(--accent-color); }

  /* Preview Gallery */
  #preview {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px;
    background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color);
    padding: 24px; border-radius: var(--radius-lg); min-height: 480px; align-content: start; box-shadow: var(--shadow-soft);
  }

  /* Card Item */
  .thumb-card {
    position: relative; border-radius: var(--radius-md); overflow: hidden;
    border: 1px solid var(--border-color); background: var(--bg-card-solid);
    aspect-ratio: 2/3; box-shadow: var(--shadow-soft); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .thumb-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .thumb-card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

  .thumb-actions {
    position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s;
  }
  .thumb-card:hover .thumb-actions { opacity: 1; }

  .thumb-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none; color: white; font-size: 11px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }
  .thumb-btn:hover { transform: scale(1.1); }
  .btn-dup { background: var(--success-color); }
  .btn-del { background: var(--danger-color); }

  /* Modal */
  #imgModal {
    display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%;
    background:rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    justify-content:center; align-items:center;
  }
  #imgModal img { max-width:90%; max-height:90%; border-radius:var(--radius-lg); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

  @media(max-width: 900px){
    .app-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo"><i class="fa-solid fa-bolt"></i></div>
    <div>
      <h1>Polaroid Studio</h1>
      <span>PRO v2.0</span>
    </div>
  </div>
  <div class="header-actions">
    <button id="quickSavePDF" class="btn btn-primary">
      <i class="fa-solid fa-file-pdf"></i> Simpan Cepat <span class="shortcut-badge">Ctrl+S</span>
    </button>
    <button id="darkToggle" class="btn btn-secondary">
      <i class="fa-solid fa-moon"></i>
    </button>
  </div>
</header>

<div class="app-layout">
  
  <!-- SIDEBAR PANEL -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-label"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Media</div>
      <div class="grid-2">
        <button class="btn btn-secondary" id="uploadFolderBtn">
          <i class="fa-solid fa-folder"></i> Folder
        </button>
        <button class="btn btn-secondary" id="uploadFilesBtn">
          <i class="fa-solid fa-image"></i> Foto <span class="shortcut-badge">Ctrl+O</span>
        </button>
      </div>
      <input type="file" id="uploadFolder" style="display:none" webkitdirectory directory multiple accept="image/*,.heic,.heif">
      <input type="file" id="uploadFiles" style="display:none" multiple accept="image/*,.heic,.heif">
    </div>

    <div class="sidebar-section">
      <div class="section-label"><i class="fa-solid fa-sliders"></i> Konfigurasi Cetak</div>
      
      <div class="form-group">
        <label>Mode Frame</label>
        <select id="styleSelect">
          <option value="polaroid">Polaroid (Bingkai)</option>
          <option value="full">Full Foto (Tanpa Bingkai)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ukuran Kertas</label>
        <select id="sizeSelect">
          <option value="6x9">2R (6 x 9 cm)</option>
          <option value="8.9x12.7">3R (8.9 x 12.7 cm)</option>
          <option value="10.2x15.2">4R (10.2 x 15.2 cm)</option>
          <option value="12.7x17.8">5R (12.7 x 17.8 cm)</option>
          <option value="15.2x20.3">6R (15.2 x 20.3 cm)</option>
          <option value="20.3x25.4">8R (20.3 x 25.4 cm)</option>
          <option value="25.4x30.5">10R (25.4 x 30.5 cm)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Background</label>
        <select id="bgSelect">
          <option value="white">Putih</option>
          <option value="black">Hitam</option>
          <option value="gray">Abu-abu</option>
          <option value="blue">Biru</option>
          <option value="cream">Cream</option>
          <option value="pink">Pink</option>
          <option value="custom">Custom Warna</option>
          <option value="image">Gambar Custom</option>
        </select>
        <input type="color" id="customColor" style="display:none; margin-top:6px;">
        <input type="file" id="bgImageInput" accept="image/*" style="display:none; margin-top:6px;">
      </div>

      <div class="form-group">
        <label>Caption / Label Pesanan</label>
        <textarea id="captionInput" rows="2" placeholder="Tulis caption..."></textarea>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px; font-size:13px; font-weight:600;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="marginColorToggle" checked> Margin Warna
        </label>
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="autoCaptionToggle"> Caption Otomatis
        </label>
      </div>
    </div>

    <hr style="border:0; border-top:1px solid var(--border-color);">

    <div style="display:flex; flex-direction:column; gap:10px;">
      <button id="savePDF" class="btn btn-primary" style="width:100%;">
        <i class="fa-solid fa-download"></i> Ekspor PDF Cetak
      </button>
      <button id="resetBtn" class="btn btn-danger" style="width:100%;">
        <i class="fa-solid fa-rotate-left"></i> Reset
      </button>
    </div>
  </aside>

  <!-- WORKSPACE PANEL -->
  <main class="workspace">
    <div class="status-banner">
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-print"></i></div>
        <div class="stat-info">
          <div class="label">Informasi Cetak Operator</div>
          <div class="value" id="infoKeterangan">Belum ada foto diunggah</div>
        </div>
      </div>
      <div id="folderName" style="font-size:13px; font-weight:700; color:var(--accent-color);"></div>
    </div>

    <div id="progressContainer">
      <div class="progress-bg"><div id="progressBar"></div></div>
      <div id="progressText">0%</div>
    </div>

    <div id="preview"></div>
  </main>
</div>

<div id="imgModal"><img id="modalImg" src="" alt="Preview Zoom"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<script>
(function(){
  'use strict';
  const { jsPDF } = window.jspdf || {};

  const uploadFolderBtn = document.getElementById('uploadFolderBtn');
  const uploadFilesBtn = document.getElementById('uploadFilesBtn');
  const uploadFolder = document.getElementById('uploadFolder');
  const uploadFiles = document.getElementById('uploadFiles');
  const sizeSelect = document.getElementById('sizeSelect');
  const bgSelect = document.getElementById('bgSelect');
  const customColor = document.getElementById('customColor');
  const bgImageInput = document.getElementById('bgImageInput');
  const captionInput = document.getElementById('captionInput');
  const saveBtn = document.getElementById('savePDF');
  const quickSaveBtn = document.getElementById('quickSavePDF');
  const resetBtn = document.getElementById('resetBtn');
  const previewDiv = document.getElementById('preview');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const infoKeterangan = document.getElementById('infoKeterangan');
  const folderNameEl = document.getElementById('folderName');
  const marginColorToggle = document.getElementById('marginColorToggle');
  const darkToggle = document.getElementById('darkToggle');
  const autoCaptionToggle = document.getElementById('autoCaptionToggle');
  const imgModal = document.getElementById('imgModal');
  const modalImg = document.getElementById('modalImg');

  let currentFiles = [];
  let bgImageObj = null;
  const autoColors = ["#ff0000","#00b050","#0070c0","#7030a0","#FFDC00","#00EAFF","#ff69b4","#828282","#C28FF3","#91E7FF"];
  let colorIndex = -1, currentColor = autoColors[0];

  const layoutConfig = {
    "6x9": {margin:0.5, border:0.5, bottom:1.5, w:6, h:9, pageW:32, pageH:48},
    "8.9x12.7": {margin:0.6, border:0.6, bottom:1.6, w:8.9, h:12.7, pageW:32, pageH:48},
    "10.2x15.2": {margin:0.7, border:0.7, bottom:1.7, w:10.2, h:15.2, pageW:32, pageH:48},
    "12.7x17.8": {margin:0.8, border:0.8, bottom:1.8, w:12.7, h:17.8, pageW:32, pageH:48},
    "15.2x20.3": {margin:0.8, border:0.9, bottom:1.9, w:15.2, h:20.3, pageW:32, pageH:48},
    "20.3x25.4": {margin:1.0, border:1.0, bottom:2.0, w:20.3, h:25.4, pageW:32, pageH:48},
    "25.4x30.5": {margin:1.2, border:1.2, bottom:2.2, w:25.4, h:30.5, pageW:32, pageH:48}
  };
  function getLayoutConfig(){ return layoutConfig[sizeSelect && sizeSelect.value] || layoutConfig["6x9"]; }

  function loadImage(src){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = (e)=>reject(e || new Error('Image load error'));
      img.src = src;
    });
  }

  function hexToRgb(hex){
    const m = hex && hex.match(/^#([0-9a-f]{6})$/i);
    return m ? [parseInt(m[1].substr(0,2),16), parseInt(m[1].substr(2,2),16), parseInt(m[1].substr(4,2),16)] : [0,0,0];
  }

  function calculateOptimal(w,h){
    const cfg = getLayoutConfig();
    const margin = cfg.margin;
    const opts = [
      {pageW: cfg.pageW, pageH: cfg.pageH, w, h, orientation:'portrait'},
      {pageW: cfg.pageH, pageH: cfg.pageW, w, h, orientation:'landscape'}
    ];
    let best = opts[0], max = -1;
    opts.forEach(opt=>{
      const cols = Math.floor((opt.pageW - 2*margin) / opt.w);
      const rows = Math.floor((opt.pageH - 2*margin) / opt.h);
      const per = Math.max(0, cols) * Math.max(0, rows);
      if(per > max){ max = per; best = opt; }
    });
    return best;
  }

  function toggleControlsLock(isLocked) {
    const controls = document.querySelectorAll('button, select, input, textarea');
    controls.forEach(el => el.disabled = isLocked);
    if (previewDiv) previewDiv.style.pointerEvents = isLocked ? 'none' : 'auto';
  }

  async function createPolaroid(img, W, H, dpi, bgOption, customCol, bgImgObjParam){
    const styleSelect = document.getElementById('styleSelect');
    const isFullImage = styleSelect && styleSelect.value === "full";
    const {border, bottom} = getLayoutConfig();
    
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(W * dpi);
    canvas.height = Math.round(H * dpi);
    const ctx = canvas.getContext('2d');

    let drawImg = img;
    if(img.width > img.height){
      const rotated = document.createElement('canvas');
      rotated.width = img.height;
      rotated.height = img.width;
      const rctx = rotated.getContext('2d');
      rctx.translate(rotated.width, 0);
      rctx.rotate(Math.PI/2);
      rctx.drawImage(img, 0, 0);
      drawImg = rotated;
    }

    if (isFullImage) {
      ctx.drawImage(drawImg, 0, 0, canvas.width, canvas.height);
    } else {
      if(bgOption === "image" && bgImgObjParam){
        const bg = bgImgObjParam;
        const scale = Math.max(canvas.width / bg.width, canvas.height / bg.height);
        const x = (canvas.width - bg.width * scale) / 2;
        const y = (canvas.height - bg.height * scale) / 2;
        ctx.drawImage(bg, x, y, bg.width * scale, bg.height * scale);
      } else {
        ctx.fillStyle = bgOption === "custom" ? customCol : bgOption;
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }

      const photoW = canvas.width - border * 2 * dpi;
      const photoH = canvas.height - (border + bottom) * dpi;
      const photoX = border * dpi, photoY = border * dpi;
      
      const ratio = Math.min(photoW / drawImg.width, photoH / drawImg.height);
      const drawW = drawImg.width * ratio, drawH = drawImg.height * ratio;
      const offsetX = photoX + (photoW - drawW) / 2, offsetY = photoY + (photoH - drawH) / 2;
      
      ctx.drawImage(drawImg, offsetX, offsetY, drawW, drawH);
    }

    return canvas.toDataURL("image/jpeg", 0.92);
  }

  function fileListToArray(fileList){
    const arr = [];
    for(let i=0;i<fileList.length;i++) arr.push(fileList[i]);
    return arr;
  }

  function updateFolderName(){
    if(!folderNameEl) return;
    if(!currentFiles.length){ folderNameEl.textContent = ""; return; }
    const f0 = currentFiles[0];
    if(f0 && f0.webkitRelativePath){
      const parts = f0.webkitRelativePath.split('/');
      if(parts.length > 1) folderNameEl.textContent = `📁 ${parts[0]}`;
      else folderNameEl.textContent = "";
    } else { folderNameEl.textContent = ""; }
  }

  function updateKeterangan(){
    if(!infoKeterangan) return;
    if(!currentFiles.length){ infoKeterangan.textContent = "Belum ada foto diunggah"; return; }
    const parts = (sizeSelect && sizeSelect.value || "6x9").split('x').map(Number);
    const w = parts[0], h = parts[1];
    const opt = calculateOptimal(w,h);
    const {margin} = getLayoutConfig();
    const cols = Math.max(1, Math.floor((opt.pageW - 2*margin) / opt.w));
    const rows = Math.max(1, Math.floor((opt.pageH - 2*margin) / opt.h));
    const perPage = Math.max(1, cols * rows);
    const lembar = Math.ceil(currentFiles.length / perPage);
    infoKeterangan.textContent = `${currentFiles.length} foto = ${lembar} lembar (${perPage} foto/lembar)`;
  }

  if(captionInput){
    captionInput.addEventListener('input', ()=>{ captionInput.dataset.manual = "true"; });
  }
  if(autoCaptionToggle){
    autoCaptionToggle.addEventListener('change', ()=>{
      if(autoCaptionToggle.checked){
        if(captionInput) captionInput.dataset.manual = "";
        updateAutoCaption(true);
      } else {
        if(captionInput && captionInput.dataset.manual !== "true"){
          captionInput.value = "";
          captionInput.dataset.manual = "";
        }
      }
    });
  }

  function updateAutoCaption(force=false){
    if(!autoCaptionToggle || !autoCaptionToggle.checked) return;
    if(currentFiles.length === 0) return;
    if(captionInput && captionInput.dataset && captionInput.dataset.manual === "true" && !force) return;

    let folder = "Folder";
    if(currentFiles[0] && currentFiles[0].webkitRelativePath){
      const parts = currentFiles[0].webkitRelativePath.split('/');
      if(parts.length > 1) folder = parts[0];
    }
    const [w,h] = (sizeSelect && sizeSelect.value || "6x9").split('x').map(Number);
    const opt = calculateOptimal(w,h);
    const {margin} = getLayoutConfig();
    const cols = Math.max(1, Math.floor((opt.pageW - 2*margin) / opt.w));
    const rows = Math.max(1, Math.floor((opt.pageH - 2*margin) / opt.h));
    const perPage = Math.max(1, cols * rows);
    const lembar = Math.ceil(currentFiles.length / perPage);
    if(captionInput) captionInput.value = `${folder} = ${lembar} lembar A3`;
  }

  if(sizeSelect){
    sizeSelect.addEventListener('change', ()=>{
      updateKeterangan();
      updateAutoCaption();
    });
  }

  if(bgSelect){
    bgSelect.addEventListener('change', ()=>{
      customColor.style.display = bgSelect.value === "custom" ? "block" : "none";
      bgImageInput.style.display = bgSelect.value === "image" ? "block" : "none";
    });
  }

  function createCardElement(dataUrl, fileName) {
    const card = document.createElement('div');
    card.className = 'thumb-card';

    const thumb = document.createElement('img');
    thumb.src = dataUrl;
    thumb.title = fileName;

    const actions = document.createElement('div');
    actions.className = 'thumb-actions';

    const dupBtn = document.createElement('button');
    dupBtn.className = 'thumb-btn btn-dup';
    dupBtn.innerHTML = '<i class="fa-solid fa-plus"></i>';
    dupBtn.onclick = (e) => { e.stopPropagation(); duplicateCardDirect(card); };

    const delBtn = document.createElement('button');
    delBtn.className = 'thumb-btn btn-del';
    delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
    delBtn.onclick = (e) => { e.stopPropagation(); deleteCardDirect(card); };

    actions.appendChild(dupBtn);
    actions.appendChild(delBtn);
    card.appendChild(thumb);
    card.appendChild(actions);

    return card;
  }

  async function duplicateCardDirect(cardElement) {
    const index = Array.from(previewDiv.children).indexOf(cardElement);
    if (index === -1) return;

    const fileToDup = currentFiles[index];
    currentFiles.splice(index + 1, 0, fileToDup);

    let objectUrl = null;
    try {
      objectUrl = URL.createObjectURL(fileToDup);
      const img = await loadImage(objectUrl);
      const [w, h] = (sizeSelect && sizeSelect.value || "6x9").split('x').map(Number);
      const data = await createPolaroid(img, w, h, 96, (bgSelect && bgSelect.value) || "white", (customColor && customColor.value) || "#ffffff", bgImageObj);

      const newCard = createCardElement(data, fileToDup.name);
      cardElement.after(newCard);
      
      updateKeterangan();
      updateAutoCaption();
    } catch(err) {
      console.error("Gagal duplikat foto:", err);
    } finally {
      if(objectUrl) URL.revokeObjectURL(objectUrl);
    }
  }

  function deleteCardDirect(cardElement) {
    const index = Array.from(previewDiv.children).indexOf(cardElement);
    if (index === -1) return;

    currentFiles.splice(index, 1);
    cardElement.remove();
    
    updateKeterangan();
    updateAutoCaption();
  }

  async function renderPreviewForFiles(filesArr){
    currentFiles = [];
    
    if(progressContainer) progressContainer.style.display = "block";
    if(progressBar) progressBar.style.width = "0%";
    if(progressText) progressText.textContent = "Menyiapkan file... (0%)";

    const totalFiles = filesArr.length;

    for(let f = 0; f < totalFiles; f++) {
      let file = filesArr[f];
      let fileName = file.name ? file.name.toLowerCase() : '';
      
      const isHeicOrHeif = fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';

      if(isHeicOrHeif) {
        try {
          let convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.7 });
          if(Array.isArray(convertedBlob)) convertedBlob = convertedBlob[0];
          const newName = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
          file = new File([convertedBlob], newName, { type: "image/jpeg" });
        } catch(err) {
          console.error("Gagal konversi HEIF/HEIC:", file.name, err);
        }
      }
      currentFiles.push(file);

      let percentConv = Math.round(((f + 1) / totalFiles) * 40);
      if(progressBar) progressBar.style.width = percentConv + '%';
      if(progressText) progressText.textContent = `Memproses file ${f + 1} dari ${totalFiles} (${percentConv}%)`;
    }

    previewDiv.innerHTML = "";
    updateFolderName();
    updateKeterangan();
    updateAutoCaption();

    if(currentFiles.length > 0){
      colorIndex = (colorIndex + 1) % autoColors.length;
      currentColor = autoColors[colorIndex];
    }

    for(let i=0; i<currentFiles.length; i++){
      const file = currentFiles[i];
      let objectUrl = null;
      try{
        objectUrl = URL.createObjectURL(file);
        const img = await loadImage(objectUrl);
        const [w,h] = (sizeSelect && sizeSelect.value || "6x9").split('x').map(Number);
        
        const data = await createPolaroid(img, w, h, 96, (bgSelect && bgSelect.value) || "white", (customColor && customColor.value) || "#ffffff", bgImageObj);
        
        const card = createCardElement(data, file.name);
        previewDiv.appendChild(card);
      }catch(err){
        console.error("Preview load failed:", file && file.name, err);
      }finally{
        if(objectUrl) URL.revokeObjectURL(objectUrl);
      }

      let percentRender = 40 + Math.round(((i + 1) / currentFiles.length) * 60);
      if(progressBar) progressBar.style.width = percentRender + '%';
      if(progressText) progressText.textContent = `Membuat preview ${i + 1} dari ${currentFiles.length} (${percentRender}%)`;
    }

    updateKeterangan();

    setTimeout(() => {
      if(progressContainer) progressContainer.style.display = "none";
      if(progressBar) progressBar.style.width = "0%";
      if(progressText) progressText.textContent = "0%";
    }, 400);
  }

  if(uploadFolderBtn && uploadFolder){
    uploadFolderBtn.addEventListener('click', ()=>{ uploadFolder.value = ""; uploadFolder.click(); });
    uploadFolder.addEventListener('change', async (e)=>{
      const filesArr = fileListToArray(e.target.files || []);
      filesArr.sort((a,b)=>{
        const pa = a.webkitRelativePath || a.name;
        const pb = b.webkitRelativePath || b.name;
        return pa.localeCompare(pb, undefined, {numeric:true, sensitivity:'base'});
      });
      await renderPreviewForFiles(filesArr);
    });
  }

  if(uploadFilesBtn && uploadFiles){
    uploadFilesBtn.addEventListener('click', ()=>{ uploadFiles.value = ""; uploadFiles.click(); });
    uploadFiles.addEventListener('change', async (e)=>{
      const filesArr = fileListToArray(e.target.files || []);
      await renderPreviewForFiles(filesArr);
    });
  }

  // EKSPOR PDF CETAK
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      try{
        if(!currentFiles.length) return alert("Upload foto dulu!");
        if(typeof jsPDF === 'undefined') return alert('Library jsPDF tidak tersedia.');

        toggleControlsLock(true);

        const [w,h] = (sizeSelect && sizeSelect.value || "6x9").split('x').map(Number);
        const {margin} = getLayoutConfig();
        const opt = calculateOptimal(w,h);
        const pdf = new jsPDF({unit:'cm', format:[opt.pageW, opt.pageH], orientation: opt.orientation});
        const cols = Math.max(1, Math.floor((opt.pageW - 2*margin) / opt.w));
        const rows = Math.max(1, Math.floor((opt.pageH - 2*margin) / opt.h));
        const perPage = Math.max(1, cols * rows);

        if(progressContainer) progressContainer.style.display = "block";
        if(progressBar) progressBar.style.width = "0%";
        if(progressText) progressText.textContent = "0%";

        let done = 0;
        const total = currentFiles.length;
        const lembar = Math.ceil(total / perPage);
        
        const rawCaption = (captionInput && captionInput.value.trim()) || "polaroid";
        const captionText = `${rawCaption} - ${lembar} lembar`;
        const safeCaption = rawCaption.replace(/[\\\/:*?"<>|]/g,"_");
        const fileName = `${safeCaption} - ${lembar} lembar.pdf`;

        for(let i=0;i<currentFiles.length;i+=perPage){
          if(i>0) pdf.addPage();
          const pageFiles = currentFiles.slice(i, i+perPage);
          const totalW = cols * opt.w, totalH = rows * opt.h;
          const left = margin + (opt.pageW - 2*margin - totalW)/2;
          const top = margin + (opt.pageH - 2*margin - totalH)/2;

          let pageBgRgb = [255, 255, 255]; 

          const bgOpt = bgSelect ? bgSelect.value : "white";
          if(bgOpt !== "image") {
            let colorStr = (bgOpt === "custom" && customColor) ? customColor.value : bgOpt;
            if(colorStr.toLowerCase() === "cream") colorStr = "#FFFDD0"; 

            if (colorStr.startsWith('#')) {
              pageBgRgb = hexToRgb(colorStr);
            } else {
              const tempDiv = document.createElement('div');
              tempDiv.style.color = colorStr;
              document.body.appendChild(tempDiv);
              const computed = window.getComputedStyle(tempDiv).color;
              document.body.removeChild(tempDiv);
              const match = computed.match(/\d+/g);
              if (match && match.length >= 3) {
                pageBgRgb = [parseInt(match[0]), parseInt(match[1]), parseInt(match[2])];
              }
            }

            pdf.setFillColor(pageBgRgb[0], pageBgRgb[1], pageBgRgb[2]);
            pdf.rect(0, 0, opt.pageW, opt.pageH, "F"); 
          }

          if(marginColorToggle && marginColorToggle.checked){
            const [r,g,b] = hexToRgb(currentColor);
            pdf.setFillColor(r,g,b);
            pdf.rect(0,0,opt.pageW,margin,"F");
            pdf.rect(0,0,margin,opt.pageH,"F");
            pdf.rect(opt.pageW-margin,0,margin,opt.pageH,"F");
          }

          pdf.setLineWidth(0.02);
          const brightness = (pageBgRgb[0] * 299 + pageBgRgb[1] * 587 + pageBgRgb[2] * 114) / 1000;
          
          if (brightness < 128 || (marginColorToggle && marginColorToggle.checked && currentColor === "#000000")) {
            pdf.setDrawColor(200, 200, 200); 
            pdf.setTextColor(255, 255, 255); 
          } else {
            pdf.setDrawColor(0, 0, 0); 
            pdf.setTextColor(0, 0, 0); 
          }

          for(let c=0;c<=cols;c++){
            const x = left + c * opt.w;
            pdf.line(x, top - 0.7, x, top - 0.2);
            pdf.line(x, top + totalH + 0.2, x, top + totalH + 0.7);
          }
          for(let r=0;r<=rows;r++){
            const y = top + r * opt.h;
            pdf.line(left - 0.7, y, left - 0.2, y);
            pdf.line(left + totalW + 0.2, y, left + totalW + 0.7, y);
          }

          pdf.setFontSize(14);
          pdf.text(captionText, opt.pageW/2, top + totalH + 1.2, {align: "center"});
          pdf.setTextColor(0, 0, 0);

          for(let idx=0; idx<pageFiles.length; idx++){
            const file = pageFiles[idx];
            let objectUrl = null;
            try{
              objectUrl = URL.createObjectURL(file);
              const img = await loadImage(objectUrl);
              const data = await createPolaroid(img, opt.w, opt.h, 200, (bgSelect && bgSelect.value) || "white", (customColor && customColor.value) || "#ffffff", bgImageObj);
              
              const col = idx % cols;
              const row = Math.floor(idx / cols);
              const imgAlias = 'img_' + Date.now() + '_' + idx;
              
              pdf.addImage(data, 'JPEG', left + col * opt.w, top + row * opt.h, opt.w, opt.h, imgAlias, 'FAST');
            }catch(err){
              console.error("Failed to render PDF image:", file && file.name, err);
            }finally{
              if(objectUrl) URL.revokeObjectURL(objectUrl);
            }
            done++;
            const p = Math.min(100, Math.round(done / total * 100));
            if(progressBar) progressBar.style.width = p + '%';
            if(progressText) progressText.textContent = p + '%';
          }
        }

        setTimeout(()=>{
          pdf.save(fileName);
          if(progressContainer) progressContainer.style.display = "none";
          if(progressBar) progressBar.style.width = "0%";
          if(progressText) progressText.textContent = "0%";
          updateKeterangan();
          
          toggleControlsLock(false);
        }, 120);

      }catch(err){
        console.error('save error', err);
        alert('Terjadi kesalahan saat menyimpan PDF.');
        toggleControlsLock(false);
      }
    });
  }

  // Quick Save Trigger
  if(quickSaveBtn && saveBtn){
    quickSaveBtn.addEventListener('click', () => saveBtn.click());
  }

  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      currentFiles = [];
      if(previewDiv) previewDiv.innerHTML = "";
      if(captionInput) { captionInput.value = ""; captionInput.dataset.manual = ""; }
      if(uploadFolder) uploadFolder.value = "";
      if(uploadFiles) uploadFiles.value = "";
      if(bgSelect) bgSelect.value = "white";
      if(customColor) customColor.value = "#ffffff";
      if(marginColorToggle) marginColorToggle.checked = true;
      if(autoCaptionToggle) autoCaptionToggle.checked = false;
      bgImageObj = null;
      if(bgImageInput) bgImageInput.value = "";
      if(folderNameEl) folderNameEl.textContent = "";
      updateKeterangan();
      if(progressContainer) progressContainer.style.display = "none";
      if(progressBar) progressBar.style.width = "0%";
      if(progressText) progressText.textContent = "0%";
    });
  }

  // Dark Mode Toggle
  window.addEventListener('DOMContentLoaded', ()=>{
    try{ if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode'); }catch(e){}
  });
  if(darkToggle){
    darkToggle.addEventListener('click', ()=>{
      const isDark = document.body.classList.toggle('dark-mode');
      try{ localStorage.setItem('darkMode', isDark); }catch(e){}
    });
  }

  // Modal Zoom
  if(previewDiv && imgModal && modalImg){
    previewDiv.addEventListener('click', (e)=>{
      if(e.target && e.target.tagName === 'IMG'){
        modalImg.src = e.target.src;
        imgModal.style.display = 'flex';
      }
    });
    imgModal.addEventListener('click', (e)=>{ if(e.target === imgModal) imgModal.style.display = 'none'; });
  }

  // Shortcuts Operator
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && imgModal && imgModal.style.display === 'flex') {
      imgModal.style.display = 'none';
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if (saveBtn) saveBtn.click();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
      e.preventDefault();
      if (uploadFilesBtn) uploadFilesBtn.click();
      return;
    }
  });

  // Re-render saat opsi diubah
  const styleSelect = document.getElementById('styleSelect');
  [styleSelect, bgSelect, customColor].forEach(el => {
    if (el) {
      el.addEventListener('change', () => {
        if (currentFiles.length > 0) renderPreviewForFiles(currentFiles);
      });
    }
  });

  if (bgImageInput) {
    bgImageInput.addEventListener('change', (e) => {
      bgImageObj = null;
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = async (ev) => {
        try {
          bgImageObj = await loadImage(ev.target.result);
          if (currentFiles.length > 0) renderPreviewForFiles(currentFiles);
        } catch (err) {
          bgImageObj = null;
          console.error('bg image load err', err);
        }
      };
      r.readAsDataURL(file);
    });
  }

  // Drag and Drop
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      const filesArr = fileListToArray(e.dataTransfer.files);
      await renderPreviewForFiles(filesArr);
    }
  });

})();
</script>
</body>
</html>
